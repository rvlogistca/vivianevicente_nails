<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivi Chagas | Nail Designer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #2b001a 0%, #4a0030 50%, #1a0010 100%);
            min-height: 100vh;
            color: white;
        }

        .crown {
            text-align: center;
            padding-top: 30px;
            font-size: 40px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .texto {
            flex: 1;
            min-width: 300px;
            padding-right: 40px;
        }

        h1 {
            font-size: 3.5rem;
            color: #ffd7e8;
            line-height: 1.2;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 1.3rem;
            font-weight: 400;
            color: #f8c8dc;
            margin-bottom: 30px;
        }

        p {
            font-size: 1rem;
            line-height: 1.8;
            color: #f0d9e3;
            margin-bottom: 40px;
            max-width: 400px;
        }

        .btn-whatsapp {
            display: inline-block;
            background: linear-gradient(90deg, #ff4da6, #ff66b3);
            color: white;
            padding: 15px 35px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            box-shadow: 0 4px 20px rgba(255, 77, 166, 0.4);
            transition: transform 0.3s ease;
            margin-bottom: 20px;
        }

        .btn-whatsapp:hover {
            transform: translateY(-3px);
        }

        .instagram {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #f8c8dc;
            font-size: 0.95rem;
        }

        .imagem-container {
            flex: 1;
            min-width: 300px;
            display: flex;
            justify-content: center;
        }

        .imagem-wrapper {
            position: relative;
        }

        .imagem-wrapper::before {
            content: '';
            position: absolute;
            top: -15px;
            left: -15px;
            right: -15px;
            bottom: -15px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff4da6, #b30059);
            opacity: 0.3;
            filter: blur(20px);
            z-index: 0;
        }

        .imagem-wrapper img {
            position: relative;
            z-index: 1;
            border-radius: 50%;
            width: 380px;
            height: 380px;
            object-fit: cover;
            border: 8px solid rgba(255, 255, 255, 0.1);
        }

        @media (max-width: 900px) {
            .container {
                flex-direction: column-reverse;
                text-align: center;
            }
            .texto {
                padding-right: 0;
                margin-top: 40px;
            }
            p {
                margin: 0 auto 40px;
            }
            .instagram {
                justify-content: center;
            }
            h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="crown">👑</div>

    <div class="container">
        <div class="texto">
            <h1>Vivi Chagas</h1>
            <h2>NAIL DESIGNER</h2>
            <p>Banho de gel e alongamentos de unhas personalizadas. Resistência e elegância em cada detalhe.</p>
            
            <a href="https://wa.me/SEUNUMERO" target="_blank" class="btn-whatsapp">📅 AGENDAR PELO WHATSAPP</a>
            
            <div class="instagram">
                <span>📷</span>
                <span>@vivianevicente.nails</span>
            </div>
        </div>

        <div class="imagem-container">
            <div class="imagem-wrapper">
                <img src="foto1.png" alt="Vivi Chagas - Nail Designer">
            </div>
        </div>
    </div>
</body>
</html>
